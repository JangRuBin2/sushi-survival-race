    <ellipse cx="27.2" cy="112.7" rx="19" ry="12" fill="#FCF2E0" stroke-width="9" transform="rotate(188.6 27.2 112.7)"/>
    <ellipse cx="111.4" cy="27.4" rx="19" ry="12" fill="#FCF2E0" stroke-width="9" transform="rotate(260.6 111.4 27.4)"/>
  </g>
</svg>
