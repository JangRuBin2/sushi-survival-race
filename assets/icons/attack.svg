    <polygon points="128,60 141,88.1 162.1,81.1 162,103.3 188.9,108.2 170,128 179.4,144.7 162,152.7 168,183 141,167.9 128,186 115,167.9 90.4,179.8 94,152.7 76.6,144.7 86,128 63.3,107 94,103.3 93.9,81.1 115,88.1" fill="#F6C446" stroke-width="10"/>
    <polygon points="138.5,95.7 139.7,114.3 152.9,115.3 145.9,126.6 160.3,138.5 141.7,139.7 140.7,152.9 129.4,145.9 117.5,160.3 116.3,141.7 103.1,140.7 110.1,129.4 95.7,117.5 114.3,116.3 115.3,103.1 126.6,110.1" fill="#EC6848" stroke-width="8"/>
